<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Голосовое сообщение</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="wave">🎙️</div>
    <h1>У меня для тебя сообщение</h1>
    <p class="subtitle">Нажми play — и слушай 👇</p>

    <audio id="player" src="voice.mp3"></audio>

    <button class="play-btn" id="playBtn" aria-label="Play">
      <span id="icon">▶</span>
    </button>

    <div class="progress-wrap">
      <div class="progress" id="progress"></div>
    </div>

    <div class="time">
      <span id="current">0:00</span>
      <span id="duration">0:00</span>
    </div>

    <p class="footer">С любовью ❤️</p>
  </div>

  <script>
    const audio = document.getElementById('player');
    const btn = document.getElementById('playBtn');
    const icon = document.getElementById('icon');
    const progress = document.getElementById('progress');
    const current = document.getElementById('current');
    const duration = document.getElementById('duration');

    const fmt = s => {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60).toString().padStart(2, '0');
      return `${m}:${sec}`;
    };

    audio.addEventListener('loadedmetadata', () => {
      duration.textContent = fmt(audio.duration);
    });

    btn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        icon.textContent = '❚❚';
      } else {
        audio.pause();
        icon.textContent = '▶';
      }
    });

    audio.addEventListener('timeupdate', () => {
      const p = (audio.currentTime / audio.duration) * 100 || 0;
      progress.style.width = p + '%';
      current.textContent = fmt(audio.currentTime);
    });

    audio.addEventListener('ended', () => {
      icon.textContent = '▶';
      progress.style.width = '0%';
    });
  </script>
</body>
</html>
